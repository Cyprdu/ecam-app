<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyprien Veyret</title>
<meta name="description" content="Retrouvez Cyprien Veyret sur LinkedIn et YouTube.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23111'/><text x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'>CV</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #0f1115; --muted: #5b6270;
    --border: #e6e8ec; --btn: #ffffff; --btn-hover: #f1f3f6;
    --glow1: rgba(10,102,194,.18); --glow2: rgba(255,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c0f; --card: #13151a; --text: #f2f4f7; --muted: #9aa1ad;
      --border: #23262e; --btn: #181b21; --btn-hover: #1f232b;
      --glow1: rgba(10,102,194,.28); --glow2: rgba(255,0,0,.16);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text); background: var(--bg);
    background-image:
      radial-gradient(600px circle at 15% 10%, var(--glow1), transparent 60%),
      radial-gradient(500px circle at 85% 90%, var(--glow2), transparent 60%);
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 400px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    padding: 40px 28px 28px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.25);
    animation: in .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .avatar {
    width: 104px; height: 104px; margin: 0 auto 20px; border-radius: 50%;
    display: block; object-fit: cover; background: var(--border);
    box-shadow: 0 0 0 4px var(--card), 0 0 0 5px var(--border);
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.4px; }
  p { margin: 8px auto 0; max-width: 300px; color: var(--muted); font-size: 15px; line-height: 1.45; }
  nav { display: grid; gap: 12px; margin-top: 28px; }
  a {
    display: flex; align-items: center; gap: 14px; padding: 14px 18px;
    border: 1px solid var(--border); border-radius: 14px; background: var(--btn);
    color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px;
    transition: transform .2s, background .2s, border-color .2s, box-shadow .2s;
  }
  a:hover { transform: translateY(-2px); background: var(--btn-hover); box-shadow: 0 8px 20px -10px rgba(0,0,0,.3); }
  a:focus-visible { outline: 2px solid #0a66c2; outline-offset: 3px; }
  a.li:hover { border-color: #0a66c2; }
  a.yt:hover { border-color: #ff0033; }
  a svg.logo { width: 24px; height: 24px; flex: none; }
  a span { flex: 1; text-align: left; }
  a svg.arrow { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; }
  a:hover svg.arrow { transform: translate(2px,-2px); }
  footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <img class="avatar" src="https://refuge-des-oublies.fr/cyprienveyret.png" alt="Photo de Cyprien Veyret">
  <h1>Cyprien VEYRET</h1>
  <p>Étudiant en Cybersécurité des Systèmes Industriels et Urbains</p>

  <nav>
    <a class="li" href="https://www.linkedin.com/in/cyprien-veyret-20722b383" target="_blank" rel="noopener">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.064 2.064 0 1 1 0-4.128 2.064 2.064 0 0 1 0 4.128zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      <span>LinkedIn</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
    </a>
    <a class="yt" href="https://www.youtube.com/@cyprienveyret" target="_blank" rel="noopener">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF0033" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><path fill="#fff" d="M9.545 15.568V8.432L15.818 12z"/></svg>
      <span>YouTube</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
    </a>
  </nav>

  <footer>© 2026 Cyprien Veyret</footer>
</main>
</body>
</html>
