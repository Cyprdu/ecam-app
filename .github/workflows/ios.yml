# Compile l'app iPhone sur un Mac de GitHub (gratuit) et fournit ECAM.ipa, non signée :
# SideStore la signe à l'installation. Onglet Actions → « App iPhone » → Run workflow.
name: App iPhone
on:
  workflow_dispatch:
  push:
    paths: ['ios/**']
permissions:
  contents: write   # pour publier l'IPA dans la version « latest »
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Projet Xcode
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Compilation
        run: |
          cd ios
          xcodebuild -project ECAM.xcodeproj -scheme ECAM -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Paquet .ipa
        run: |
          cd ios
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/ECAM.app Payload/
          zip -qry ECAM.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ECAM-ipa
          path: ios/ECAM.ipa
      # Lien fixe vers la dernière version, téléchargeable depuis l'iPhone sans compte GitHub :
      # https://github.com/Cyprdu/ecam-app/releases/latest/download/ECAM.ipa
      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "App iPhone ECAM" --notes "Dernière version de l'app iPhone (à installer avec SideStore)." --latest
          gh release upload latest ios/ECAM.ipa --clobber
          gh release edit latest --notes "Dernière version de l'app iPhone, compilée le $(date -u '+%d/%m/%Y à %H:%M') UTC (commit ${GITHUB_SHA::7}). À installer avec SideStore." --latest
